<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário DIGITAL</title>

    <link rel="stylesheet" href="../style/formulario.css" />
  </head>
  <body>
    <h1>Cadastro</h1>
    <br />
    <form>
      <div>
        <label class="block" for="nome">Nome</label>
        <input
          type="text"
          id="nome"
          name="nome"
          required
          placeholder="Digite seu nome"
        />
      </div>

      <div>
        <label class="block" for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          size="60"
          required
          placeholder="Digite seu email"
        />
      </div>

      <div>
        <label class="block" for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          required
          placeholder="Digite senha"
        />
      </div>
      <div>
        <div>
          <label class="block" for="nasc">Data de Nascimento</label>
          <input type="date" name="nasc" required />
        </div>
        <div>
          <legend>Qual o seu nivel?</legend>
          <div>
            <input type="radio" name="nivel" id="jr" value="jr" />
            <label for="jr">Júnior</label>
          </div>
          <div>
            <input type="radio" name="nivel" id="pl" value="pl" />
            <label for="pl">Pleno</label>
          </div>
          <div>
            <input type="radio" name="nivel" id="sr" value="jr" />
            <label for="sr">Sênior</label>
          </div>
          <div>
            <input type="radio" name="nivel" id="ou" value="ou" />
            <label for="ou">Outro</label>
            <div>
              <label for="obervação">Em caso de outro, qual?</label>
              <textarea class="block" name="observação" id="obs"></textarea>
            </div>
          </div>
        </div>

        <div>
          <legend>Quais a sua stack?</legend>
          <div>
            <input type="checkbox" name="stack" id="html" value="html" />
            <label for="html">HTML</label>
          </div>
          <div>
            <input type="checkbox" name="stack" id="css" value="css" />
            <label for="js">CSS</label>
          </div>
        </div>
          <div>
            <input type="checkbox" name="stack" id="js" value="js" />
            <label for="js">Java Script</label>
          </div>
        </div>

        <button>Cadastrar</button>
      </div>
    </form>
  </body>
</html>
