<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table,tr, th,td{
            border: 1px solid;
            border-collapse: collapse;

        }
    </style>
</head>
<body>
    <table>
        <thead>
            <!-- 1a linha -->
             <tr>
                <th colspan="3">Usuarios</th>
             </tr>

            <!-- segunda linha -->

            <tr>
                <th>id</th>
                <th>nome</th>
                <th>contato</th>
            </tr>
        </thead>
        <tbody>

            <!-- 3a -->
            <tr>
                <td>1</td>
                <td>William</td>
                <td>988800-90111</td>
            </tr>
        </tbody>
        <tfoot></tfoot>
        
    </table>
    <hr>
    
</body>
</html>
